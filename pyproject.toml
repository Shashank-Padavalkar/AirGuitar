[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airguitarcv"
version = "0.1.0"
description = "A real-time computer-vision-based virtual guitar system."
authors = [{ name = "Shashank", email = "shashank@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0"
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
